services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.prod
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: admin
      DB_PASS: 123456
      DB_NAME: exercicio2
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: exercicio2
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: